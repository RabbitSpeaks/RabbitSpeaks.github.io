<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rabbit Speaks</title>
	<meta name="description" content="Self-taught game developer and technical artist specializing in stylized VFX, 3D character pipelines, and shader authoring.">
	<style>
		:root { --bg: #f7f7f9; --text: #1d1d22; --muted: #5d5d68; --card: #ffffff; --line: #e2e2e8; --link: #2a5bd7; }
		@media (prefers-color-scheme: dark) {
			:root { --bg: #16161a; --text: #ececf1; --muted: #a2a2ad; --card: #202026; --line: #2f2f37; --link: #8fb0ff; }
		}
		* { box-sizing: border-box; }
		body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
		main { max-width: 680px; margin: 0 auto; padding: 48px 16px 64px; }
		h1 { font-size: 2rem; margin: 0 0 4px; }
		.tagline { color: var(--muted); margin: 0 0 40px; }
		h2 { font-size: 1.1rem; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
		.game { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
		.game h3 { margin: 0 0 6px; font-size: 1.25rem; }
		.game p { margin: 0 0 12px; }
		.links a { margin-right: 18px; }
		a { color: var(--link); }
		footer { margin-top: 48px; color: var(--muted); font-size: 0.95rem; }
	</style>
</head>
<body>
	<main>
		<h1>Rabbit Speaks</h1>
		<p class="tagline">Small, tappable games for your phone.</p>

		<h2>Games</h2>
		<section class="game">
			<h3>Dunderball</h3>
			<p>Tap the bouncing ball as many times as you can before the timer runs out.</p>
			<p class="links">
				<!-- Add the Play Store link once the game is published: -->
				<!-- <a href="https://play.google.com/store/apps/details?id=com.rabbitspeaks.dunderball">Google Play</a> -->
				<a href="dunderball/privacy-policy.html">Privacy policy</a>
			</p>
		</section>

		<footer>
			Contact: <a href="mailto:rabbitxspeaks@gmail.com">rabbitxspeaks@gmail.com</a>
		</footer>
	</main>
</body>
</html>
